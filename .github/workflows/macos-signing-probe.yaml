name: macOS signing probe

# Verification A2 and V2: can the Developer ID signature and Apple notarization of plugin bundles inside zip archives
# be told apart on a macOS runner? Samples are downloaded from their authors' releases and checked by SHA-256.
# Nothing in the samples is executed.
# V2 adds: (U26) unstapled copies are assessed before the originals, so a ticket cached from the original cannot help;
# (U28) the unstapled copies are assessed again with Apple's ticket lookup blocked, to tell a failed lookup from a rejection;
# (U53) LV2 bundles and the binaries inside them are assessed; (U54) ditto -x -k is run on crafted zips with a symlink
# and with ../ paths, and the result is listed.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Probe samples
        run: |
          # Rejections by codesign and spctl are results to record, so a failing command must not stop the step.
          set +e -uo pipefail
          work="${RUNNER_TEMP}/samples"
          out="${RUNNER_TEMP}/results"
          mkdir -p "${work}" "${out}"
          sw_vers > "${out}/runner.txt"

          # name|expected|url|sha256
          cat > "${work}/list.txt" <<'EOF'
          retroplug|developer-id-notarized|https://github.com/tommitytom/RetroPlug/releases/download/v0.7.4/retroplug-v0.7.4-macos-universal-vst3.zip|50b0f72677982ae556d95ebebaf6cd56f2dd786f22c4eec92b07ceae21bf09d1
          kr106|developer-id-notarized|https://github.com/kayrockscreenprinting/ultramaster_kr106/releases/download/v2.5.13/KR106-macOS.zip|e34e6ec4eca6d9ab07c5ef9ef20368267c02119e5cf41f73595be51dd80edcbe
          hamburger|developer-id-notarized|https://github.com/Davit-G/Hamburger/releases/download/v0.9/Hamburger.v0.9.MacOS.arm64.Apple.Silicon.zip|e624cc09873206e1c8b3dd53be2894c720b1298673b8084acd154cb3b101b9e2
          orchestra|apple-development|https://github.com/Tronhjem/ORchestra/releases/download/v0.2.6/ORchestra-v0.2.6-macOS-arm64.zip|09ae5603c4e000d08af9a0745ea04473e8e2b00ceaf26a295ac41988bea2eaf4
          gate12|adhoc|https://github.com/tiagolr/gate12/releases/download/v1.3.3/gate12-macos-v1.3.3.zip|2c11517bd9b59a83fa813fe9f933c4233deff5c7571b4e299c8b6fd91b2e7189
          dexed|adhoc-or-unsigned|https://github.com/asb2m10/dexed/releases/download/v1.1.0/Dexed-1.1.0-macOS.zip|d6576d064313327e216cec9d6f62caa650b44746bc7c8d4b010df7f55d9b8ae3
          EOF

          probe_bundle() {
            local sample="$1" expected="$2" variant="$3" bundle="$4"
            local log
            log="${out}/${sample}-${variant}-$(basename "${bundle}" | tr ' ' '_').txt"
            {
              echo "== ${sample} ${variant} ${bundle} (expected ${expected})"
              echo "-- codesign -dv --verbose=4"
              codesign -dv --verbose=4 "${bundle}" 2>&1
              echo "exit=$?"
              echo "-- codesign --verify --deep --strict --verbose=2"
              codesign --verify --deep --strict --verbose=2 "${bundle}" 2>&1
              echo "exit=$?"
              for type in execute install open; do
                echo "-- spctl --assess -vvv --type ${type}"
                if [ "${type}" = open ]; then
                  spctl --assess -vvv --type open --context context:primary-signature "${bundle}" 2>&1
                else
                  spctl --assess -vvv --type "${type}" "${bundle}" 2>&1
                fi
                echo "exit=$?"
              done
              echo "-- xcrun stapler validate"
              xcrun stapler validate "${bundle}" 2>&1
              echo "exit=$?"
            } > "${log}"
            cat "${log}"
          }

          sed 's/^ *//' "${work}/list.txt" | while IFS='|' read -r name expected url sha; do
            [ -z "${name}" ] && continue
            dir="${work}/${name}"
            mkdir -p "${dir}"
            if ! curl -fsSL -o "${dir}/sample.zip" "${url}"; then
              echo "${name}: download failed" | tee -a "${out}/errors.txt"
              continue
            fi
            if ! echo "${sha}  ${dir}/sample.zip" | shasum -a 256 -c -; then
              echo "${name}: sha256 mismatch" | tee -a "${out}/errors.txt"
              continue
            fi
            ditto -x -k "${dir}/sample.zip" "${dir}/x"
            find "${dir}/x" -type d \( -name '*.vst3' -o -name '*.clap' -o -name '*.component' -o -name '*.lv2' \) -prune -print \
              | while read -r bundle; do
                  # The stapled ticket lives in Contents/CodeResources, outside the signature's seal.
                  # Removing it from a copy shows whether notarization can be told by the online check alone.
                  # The copy is assessed first (U26), so a ticket fetched for the original is not reused.
                  if [ -f "${bundle}/Contents/CodeResources" ]; then
                    copy="${dir}/unstapled/$(basename "${bundle}")"
                    mkdir -p "${dir}/unstapled"
                    ditto "${bundle}" "${copy}"
                    rm "${copy}/Contents/CodeResources"
                    echo "${name}|${expected}|${copy}" >> "${work}/unstapled.txt"
                    probe_bundle "${name}" "${expected}" unstapled "${copy}"
                  fi
                  probe_bundle "${name}" "${expected}" original "${bundle}"
                  # LV2 bundles are plain folders; the signed object is the binary inside (U53).
                  case "${bundle}" in
                    *.lv2)
                      find "${bundle}" -type f \( -name '*.dylib' -o -name '*.so' \) | while read -r binary; do
                        probe_bundle "${name}" "${expected}" lv2-binary "${binary}"
                      done
                      ;;
                  esac
                done
          done

          # U28: assess the unstapled copies again with the ticket lookup host blocked, and record exit codes and messages.
          if [ -f "${work}/unstapled.txt" ]; then
            sudo cp /etc/hosts "${work}/hosts.bak"
            echo "0.0.0.0 api.apple-cloudkit.com" | sudo tee -a /etc/hosts > /dev/null
            sudo dscacheutil -flushcache
            while IFS='|' read -r name expected copy; do
              probe_bundle "${name}" "${expected}" unstapled-offline "${copy}"
            done < "${work}/unstapled.txt"
            sudo cp "${work}/hosts.bak" /etc/hosts
            sudo dscacheutil -flushcache
          fi

          # U54: what ditto -x -k does with a symlink entry and with ../ paths. Nothing is executed.
          crafted="${work}/crafted"
          mkdir -p "${crafted}"
          python3 - "${crafted}" <<'PY'
          import sys, zipfile, stat
          d = sys.argv[1]
          with zipfile.ZipFile(f"{d}/symlink.zip", "w") as z:
              info = zipfile.ZipInfo("Plugin.vst3/Contents/link")
              info.create_system = 3
              info.external_attr = (stat.S_IFLNK | 0o777) << 16
              z.writestr(info, "../../../../outside-target")
              z.writestr("Plugin.vst3/Contents/Info.plist", "<plist/>")
          with zipfile.ZipFile(f"{d}/dotdot.zip", "w") as z:
              z.writestr("../escaped-by-dotdot.txt", "escaped")
              z.writestr("Plugin.vst3/../../escaped-nested.txt", "escaped")
              z.writestr("Plugin.vst3/Contents/Info.plist", "<plist/>")
          PY
          for zipname in symlink dotdot; do
            dest="${crafted}/out-${zipname}/dest"
            mkdir -p "${dest}"
            {
              echo "== ditto -x -k ${zipname}.zip"
              ditto -x -k "${crafted}/${zipname}.zip" "${dest}" 2>&1
              echo "exit=$?"
              echo "-- files under out-${zipname} (dest is one level below)"
              find "${crafted}/out-${zipname}" -exec ls -ld {} \; 2>&1
              echo "-- files named escaped* or outside-target anywhere under the work dir"
              find "${work}" \( -name 'escaped*' -o -name 'outside-target' \) 2>&1
            } > "${out}/ditto-${zipname}.txt"
            cat "${out}/ditto-${zipname}.txt"
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: macos-signing-probe
          path: ${{ runner.temp }}/results
          if-no-files-found: error
