name: Verify release files

# 掲載を待つ配布物の証明を検証し、アーカイブの中身を検査し、新しい版のソースから通信の API と README 以外の文書の案内を探して、
# 結果を音のプラグイン倉庫くんへ送る
# (docs/design/scanning.md の「配布物の検証のワークフロー」、docs/decisions/0014-attestation-verification-in-actions.md)。
# 音のプラグイン倉庫くんの /internal/checks/ は、このリポジトリの main で動作するこのワークフローの OIDC のトークンだけを受け付ける。
# 第三者のデータを処理する scan ジョブには id-token を付けない。MCP Registry は OIDC のトークンの repository_owner だけで
# io.github.AllegroMoltoV/* の公開権限を与えるため、そのジョブで第三者のデータを処理するツールの脆弱性を突かれると、
# Registry の登録を書き換えられるトークンを発行されうる。トークンを取るのは、第三者のデータを処理しない prepare と report だけにする。
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-release-files
  cancel-in-progress: false

env:
  SOKO_KUN_ORIGIN: https://audio-soko-kun.allegromoltov.jp
  # 配布物 1 件の取得の上限 (2 GiB) と、scan の最初に確かめる空き容量 (取得の上限に 1 GiB を足した値)
  MAX_DOWNLOAD_BYTES: '2147483648'
  MIN_FREE_BYTES: '3221225472'
  # scan の開始からこの秒数を過ぎたら、新しい配布物と通信の検出のソースを取得しない。残りは次の回に回す。
  # 結果は最後にまとめて送るため、ジョブが時間切れ (timeout-minutes) になるとその回の結果をすべて失う。
  FETCH_DEADLINE_SECONDS: '1500'

jobs:
  # 検証待ちの一覧を受け取り、artifact で scan へ渡す。
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    outputs:
      has_work: ${{ steps.pending.outputs.has_work }}
    steps:
      - name: Fetch pending release files
        id: pending
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/pending"
          mkdir -p "${out}"
          token=$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=audio-soko-kun" | jq -r '.value')
          curl -fsS -H "Authorization: Bearer ${token}" "${SOKO_KUN_ORIGIN}/internal/checks/pending" > "${out}/pending.json"
          count=$(jq '.assets | length' "${out}/pending.json")
          releases=$(jq '(.releases // []) | length' "${out}/pending.json")
          echo "pending: ${count} assets, ${releases} releases for the network scan"
          if [ "${count}" -eq 0 ] && [ "${releases}" -eq 0 ]; then has_work=false; else has_work=true; fi
          echo "has_work=${has_work}" >> "${GITHUB_OUTPUT}"
      # 一覧は 1 件ごとに旧い名前を繰り返すため大きくなりうる。job output は環境変数で次の job へ渡り 128 KiB に掛かるため、
      # artifact で渡す。prepare は第三者のデータを処理せず、一覧は受け口が作ったものなので、scan で展開しても安全上の問題は無い。
      - name: Upload the pending list
        if: steps.pending.outputs.has_work == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pending-checks
          path: ${{ runner.temp }}/pending/pending.json
          if-no-files-found: error
          retention-days: 1

  # 第三者の配布物とソースを取得して検証し、送る結果を job output で report へ渡す。OIDC のトークンは取らない。
  scan:
    needs: prepare
    if: needs.prepare.outputs.has_work == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    outputs:
      body_0: ${{ steps.verify.outputs.body_0 }}
      body_1: ${{ steps.verify.outputs.body_1 }}
      body_2: ${{ steps.verify.outputs.body_2 }}
      body_3: ${{ steps.verify.outputs.body_3 }}
      body_4: ${{ steps.verify.outputs.body_4 }}
      body_5: ${{ steps.verify.outputs.body_5 }}
      body_6: ${{ steps.verify.outputs.body_6 }}
      body_7: ${{ steps.verify.outputs.body_7 }}
    steps:
      # 権限の付け間違いで、このジョブが OIDC のトークンを取れる状態になっていないことを確かめる。
      - name: Confirm that no OIDC token can be requested
        run: |
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "The scan job must not have id-token: write." >&2
            exit 1
          fi
          echo "No OIDC token request variables are set."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # scan-docs.mjs は、照合の型を Worker と共有する src/review/guidance-patterns.mjs から読む。
          # cone mode のため、ファイルではなくディレクトリで指定する。
          sparse-checkout: |
            .github/scripts
            src/review
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pending-checks
          path: ${{ runner.temp }}/pending
      - name: Verify pending release files
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 第三者の文字列 (エラーの文面やパス) がログの行頭に出ても、ワークフローコマンドとして解釈させない。
          # ::add-mask:: で本文の一部を秘密として登録されると、その値を含むジョブの出力が捨てられ、report が壊れた本文を送って
          # 同じ一覧で失敗を繰り返すため。結果はファイル (GITHUB_OUTPUT) で渡すため、この停止の影響を受けない。
          echo "::stop-commands::$(openssl rand -hex 16)"
          started=$(date +%s)
          past_deadline() { [ $(( $(date +%s) - started )) -ge "${FETCH_DEADLINE_SECONDS}" ]; }
          work="${RUNNER_TEMP}/verify"
          mkdir -p "${work}"
          free=$(df --output=avail -B1 "${work}" | tail -1 | tr -d ' ')
          if [ "${free}" -lt "${MIN_FREE_BYTES}" ]; then
            echo "free space ${free} bytes is below ${MIN_FREE_BYTES}; skip this run"
            exit 0
          fi

          pending="${RUNNER_TEMP}/pending/pending.json"
          count=$(jq '.assets | length' "${pending}")
          releases=$(jq '(.releases // []) | length' "${pending}")

          echo '[]' > "${work}/results.json"
          echo '[]' > "${work}/scans.json"
          for i in $(seq 0 $((count - 1))); do
            if past_deadline; then
              echo "fetch deadline reached; $((count - i)) assets are left for the next run"
              break
            fi
            item=$(jq -c ".assets[${i}]" "${pending}")
            asset_id=$(jq -r '.assetId' <<< "${item}")
            kind=$(jq -r '.kind' <<< "${item}")
            url=$(jq -r '.downloadUrl' <<< "${item}")
            digest=$(jq -r '.digest' <<< "${item}")
            repository=$(jq -r '.repository' <<< "${item}")
            repository_id=$(jq -r '.repositoryId // empty' <<< "${item}")
            # 現在の名前、旧い名前 (新しい順) の順に試す。名前を変える前に作られた証明は、作られたときの名前でしか通らない (派生元の ADR 0015)。
            mapfile -t names < <(jq -r '.repository, (.previousRepositories // [])[]' <<< "${item}")
            tag=$(jq -r '.tag' <<< "${item}")
            commit=$(jq -r '.commitSha' <<< "${item}")
            signer=$(jq -r '.signerWorkflow // empty' <<< "${item}")
            file="${work}/asset-${asset_id}"
            result=error
            reason=download_failed
            signer_found=""
            # 中身の検査の結果は 1 件で 300 KB ほどになりうるため、jq の引数ではなくファイルで渡す (null は結果なし)。
            content="${work}/content-entry.json"
            echo 'null' > "${content}"

            # 配布物は 1 件ずつ取得し、処理を終えるたびに削除する。中のコードは実行しない。
            status=0
            curl -fsSL --max-filesize "${MAX_DOWNLOAD_BYTES}" -o "${file}" "${url}" || status=$?
            if [ "${status}" -eq 63 ]; then reason=download_too_large; fi
            if [ "${status}" -eq 0 ]; then
              actual="sha256:$(sha256sum "${file}" | cut -d' ' -f1)"
              if [ "${actual}" != "${digest}" ]; then
                result=failed
                reason=digest_mismatch
              else
                result=failed
                reason=verification_failed
                for name in "${names[@]}"; do
                  args=(attestation verify "${file}" --repo "${name}" --source-ref "refs/tags/${tag}" --source-digest "${commit}" --format json)
                  if [ -n "${signer}" ]; then args+=(--signer-workflow "${name}/${signer}"); fi
                  if gh "${args[@]}" > "${work}/out.json" 2> "${work}/err.txt"; then
                    # 名前は別のリポジトリに使われうるため、証明書のリポジトリ ID が登録したものと同じことも確かめる。
                    found_id=$(jq -r '.[0].verificationResult.signature.certificate.sourceRepositoryIdentifier // empty' "${work}/out.json")
                    if [ -n "${repository_id}" ] && [ "${found_id}" != "${repository_id}" ]; then
                      reason=repository_id_mismatch
                      echo "  ${name}: repository id ${found_id} differs from ${repository_id}"
                      continue
                    fi
                    # buildSignerURI は https://github.com/<owner>/<repo>/<workflow のパス>@<ref> の形。
                    uri=$(jq -r '.[0].verificationResult.signature.certificate.buildSignerURI // empty' "${work}/out.json")
                    signer_found=$(sed -E 's#^https://github\.com/[^/]+/[^/]+/##; s#@.*$##' <<< "${uri}")
                    result=passed
                    reason=""
                    break
                  fi
                  echo "  ${name}: not verified"
                  sed 's/^/    /' "${work}/err.txt" | head -5
                done
              fi
              # アーカイブの中身は、ファイルへ展開せずメモリ上で読んで検査する。digest が違えば検査しない。
              if [ "${kind}" = "archive" ]; then
                if python3 -I .github/scripts/inspect_archive.py --digest "${digest}" "${file}" > "${work}/content.json"; then
                  jq -c '.diagnostics' "${work}/content.json" | sed 's/^/  diagnostics: /'
                  jq -c '{result, reason, bundles, formats, os, arches, vst2Files, categories}' "${work}/content.json" > "${content}"
                else
                  echo '{"result":"error","reason":"inspect_failed"}' > "${content}"
                fi
              fi
            elif [ "${kind}" = "archive" ]; then
              jq -cn --arg reason "${reason}" '{result: "error", reason: $reason}' > "${content}"
            fi
            rm -f "${file}"
            echo "${repository} ${tag} asset ${asset_id}: attestation ${result} ${reason}; content $(jq -r '.result // "none"' "${content}")"
            jq --argjson id "${asset_id}" --arg result "${result}" --arg reason "${reason}" --arg signer "${signer_found}" \
              --slurpfile content "${content}" \
              '. + [{assetId: $id,
                     attestation: ({result: $result}
                       + (if $reason == "" then {} else {reason: $reason} end)
                       + (if $signer == "" then {} else {signerWorkflow: $signer} end))}
                    + (if $content[0] == null then {} else {content: $content[0]} end)]' \
              "${work}/results.json" > "${work}/results.next" && mv "${work}/results.next" "${work}/results.json"
          done

          # 版ごとに、そのコミットのソースだけを取得して通信の API と、README 以外の文書の案内を探す。ソースは実行もビルドもしない。
          for i in $(seq 0 $((releases - 1))); do
            if past_deadline; then
              echo "fetch deadline reached; $((releases - i)) network scans are left for the next run"
              break
            fi
            item=$(jq -c ".releases[${i}]" "${pending}")
            release_id=$(jq -r '.releaseId' <<< "${item}")
            repository=$(jq -r '.repository' <<< "${item}")
            commit=$(jq -r '.commitSha' <<< "${item}")
            src="${work}/src-${release_id}"
            # 出力が大きくなりうるため、jq の引数ではなくファイルで受ける。空のままなら失敗。
            : > "${work}/scan.json"
            : > "${work}/docs.json"
            # 第三者のソースで、同じ回のほかの版の検証を止めないよう、取得と取り出しに時間の上限を付け、
            # 取り出しの前後でディスクの空きを確かめる。Git LFS のファイルは取得しない。
            if [[ "${repository}" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]] && [[ "${commit}" =~ ^[0-9a-f]{40}$ ]] \
                && [ "$(df --output=avail -B1 "${work}" | tail -1 | tr -d ' ')" -ge "${MIN_FREE_BYTES}" ]; then
              mkdir -p "${src}"
              if (cd "${src}" && export GIT_LFS_SKIP_SMUDGE=1 && git init -q \
                  && timeout 120 git fetch -q --depth 1 --no-tags "https://github.com/${repository}.git" "${commit}" \
                  && timeout 120 git checkout -q FETCH_HEAD) \
                  && [ "$(df --output=avail -B1 "${work}" | tail -1 | tr -d ' ')" -ge "${MIN_FREE_BYTES}" ]; then
                timeout 60 bash .github/scripts/scan-network.sh "${src}" > "${work}/scan.json" || true
                # 同じ取り出しで、README 以外の文書の案内を照合する。どちらかが失敗した版は error として送り、やり直させる。
                timeout 60 node .github/scripts/scan-docs.mjs "${src}" > "${work}/docs.json" || true
              fi
            fi
            rm -rf "${src}"
            if jq -e . "${work}/scan.json" > /dev/null 2>&1 && jq -e . "${work}/docs.json" > /dev/null 2>&1; then
              echo "${repository} ${commit}: $(jq '.hits | length' "${work}/scan.json") network API hits, $(jq '.hits | length' "${work}/docs.json") document hits"
              jq --argjson id "${release_id}" --slurpfile scan "${work}/scan.json" --slurpfile docs "${work}/docs.json" \
                '. + [{releaseId: $id, result: "done"} + $scan[0] + {docHits: $docs[0].hits, docTruncated: $docs[0].truncated}]' \
                "${work}/scans.json" > "${work}/scans.next" && mv "${work}/scans.next" "${work}/scans.json"
            else
              echo "${repository} ${commit}: network scan error"
              jq --argjson id "${release_id}" '. + [{releaseId: $id, result: "error"}]' \
                "${work}/scans.json" > "${work}/scans.next" && mv "${work}/scans.next" "${work}/scans.json"
            fi
          done

          # 当たりのファイル名を、受け口 (src/review/network.ts の FILE: 改行と NUL を含まず 200 文字以下) が受け付ける形に整える。
          # 受け口は形の合わない当たりを捨てるため、深いパスや改行を含む名前のファイルに置いた処理の検出が消えないようにする。
          # 改行・CR・NUL は ? に置き換え、100 文字 (コードポイント) を超える名前は末尾の 99 文字を残して先頭を … にする。
          # 受け口は UTF-16 の長さで数えるため、1 文字が 2 単位になる文字だけでも 200 以下に収まる。
          # -a は非 ASCII を \u の形に直す。次の分割をバイト単位で行っても文字が壊れず、環境変数の上限も文字数と一致する。
          # -j は末尾の改行を付けない。
          jq -ajc --slurpfile scans "${work}/scans.json" '
            def fix_file: explode | map(if . == 0 or . == 10 or . == 13 then 63 else . end) | implode
              | if length > 100 then "…" + .[-99:] else . end;
            def fix_hits: if type == "array" then map(if (.file | type) == "string" then .file |= fix_file else . end) else . end;
            {results: ., networkScans: ($scans[0] | map(if .result == "done" then (.hits |= fix_hits) | (.docHits |= fix_hits) else . end))}
          ' "${work}/results.json" > "${work}/body.json"

          # report は送る本文を環境変数で受け取る。Linux の環境変数 1 つの上限 (128 KiB) を超えうるため、
          # 100,000 バイトずつ最大 8 個の output に分ける。8 個の合計 800,000 バイトは job output の上限 (1 MB) に収まる。
          # 超えるときは、通信の検出の結果 (done のもの) と中身の検査の結果 (bundles を持つもの) のうち、送る形 (ASCII に変換した後) の本文が最も大きい 1 つを error に置き換え、
          # 収まるまで繰り返す。中身の検査は 1 件で 300 KB を超えうる一方、通信の検出は 1 版あたり小さく抑えられている。
          # 大きいものから置き換えるため、巨大な配布物を出した第三者のせいで、同じ回にいるほかの作者の小さい結果が error になることはない。
          # 失敗で止めると受け口に何も届かず、試行の回数も増えないため、同じ一覧で失敗を繰り返してほかのプラグインの証明の検証まで止まる。
          # error にしたものは、受け口で試行を数え、使い切ると既存の扱いへ進む。
          chunk=100000
          while [ "$(wc -c < "${work}/body.json")" -gt $((chunk * 8)) ]; do
            # size は jq -a で出力した後のバイト数にする。非 ASCII は \uXXXX (6 バイト、BMP 外は 12 バイト) になる。
            # tojson の出力に残るエスケープは、その時点で ASCII の 2 文字以上になっている。
            pick=$(jq -r 'def size: tojson | [explode[] | if . > 65535 then 12 elif . > 127 then 6 else 1 end] | add;
              ([.networkScans[] | select(.result == "done") | {kind: "scan", id: .releaseId, size: size}]
              + [.results[] | select(.content.bundles != null) | {kind: "content", id: .assetId, size: (.content | size)}])
              | max_by(.size) // empty | "\(.kind) \(.id)"' "${work}/body.json")
            if [ -z "${pick}" ]; then
              echo "results are too large to pass to the report job even without scans and contents: $(wc -c < "${work}/body.json") bytes" >&2
              exit 1
            fi
            kind="${pick%% *}"
            id="${pick##* }"
            if [ "${kind}" = "scan" ]; then
              echo "release ${id}: network scan results are too large to send; reporting as error"
              jq -ajc --argjson id "${id}" \
                '.networkScans |= map(if .releaseId == $id then {releaseId: .releaseId, result: "error"} else . end)' \
                "${work}/body.json" > "${work}/body.next"
            else
              echo "asset ${id}: content results are too large to send; reporting as error"
              # reason は受け口が受け付ける形 (src/checks/route.ts の REASON) にする。
              jq -ajc --argjson id "${id}" \
                '.results |= map(if .assetId == $id then .content = {result: "error", reason: "result_too_large"} else . end)' \
                "${work}/body.json" > "${work}/body.next"
            fi
            mv "${work}/body.next" "${work}/body.json"
          done
          for k in 0 1 2 3 4 5 6 7; do
            echo "body_${k}=$(head -c $(((k + 1) * chunk)) "${work}/body.json" | tail -c +$((k * chunk + 1)))" >> "${GITHUB_OUTPUT}"
          done

  # scan の結果を倉庫くんへ送るだけにする。第三者のデータに由来する body は、展開も解析もせずにそのまま送り、形の検証は受け口に任せる。
  report:
    needs: scan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
    steps:
      - name: Send results
        env:
          BODY_0: ${{ needs.scan.outputs.body_0 }}
          BODY_1: ${{ needs.scan.outputs.body_1 }}
          BODY_2: ${{ needs.scan.outputs.body_2 }}
          BODY_3: ${{ needs.scan.outputs.body_3 }}
          BODY_4: ${{ needs.scan.outputs.body_4 }}
          BODY_5: ${{ needs.scan.outputs.body_5 }}
          BODY_6: ${{ needs.scan.outputs.body_6 }}
          BODY_7: ${{ needs.scan.outputs.body_7 }}
        run: |
          set -euo pipefail
          # scan が空き容量の不足で早く終わった回は、本文が無い。送らない。
          if [ -z "${BODY_0}" ]; then
            echo "scan produced no results; nothing to send"
            exit 0
          fi
          token=$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=audio-soko-kun" | jq -r '.value')
          printf '%s' "${BODY_0}" "${BODY_1}" "${BODY_2}" "${BODY_3}" "${BODY_4}" "${BODY_5}" "${BODY_6}" "${BODY_7}" \
            | curl -fsS -X POST -H "Authorization: Bearer ${token}" -H 'Content-Type: application/json' \
              --data-binary @- "${SOKO_KUN_ORIGIN}/internal/checks/results"
